name: siga-suiza-2026

x-backend: &backend
  build:
    context: ./siga_backend
    dockerfile: Dockerfile
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &backend-env
    DB_HOST: ${SIGA_DB_HOST:-postgres}
    DB_PORT: ${SIGA_DB_PORT:-5432}
    DB_USER: ${DB_USER:?Defina DB_USER en .env}
    DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    DB_NAME: ${DB_NAME:-siga_suiza_2026}
    NATS_URL: nats://nats:4222
    REDIS_URL: redis://redis:6379
    REDIS_HOST: redis
    REDIS_PORT: 6379
    SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    PYTHONUNBUFFERED: 1
  volumes:
    - ./siga_backend:/app
  depends_on: &backend-depends
    postgres:
      condition: service_healthy
    nats:
      condition: service_started
    redis:
      condition: service_healthy
    db-init:
      condition: service_completed_successfully

x-module: &module
  <<: *backend
  depends_on:
    <<: *backend-depends
    db-migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD-SHELL", "python -c 'import os, urllib.request; urllib.request.urlopen(\"http://127.0.0.1:\" + os.getenv(\"PORT\", \"8000\") + \"/health\", timeout=3)'"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:?Defina DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:-siga_suiza_2026}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.9-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:?Defina DB_USER en .env}
      PGPASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      PGDATABASE: ${DB_NAME:-siga_suiza_2026}
    volumes:
      - ./siga_backend/db_scripts/000_outbox_events.sql:/init.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/init.sql"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  db-migrate:
    build:
      context: ./siga_backend
      dockerfile: Dockerfile
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    environment:
      <<: *backend-env
      DB_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${SIGA_DB_HOST:-postgres}:${SIGA_DB_PORT:-5432}/${DB_NAME:-siga_suiza_2026}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"

  siga-core:
    <<: *backend
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      SKIP_MIGRATIONS: "true"
    depends_on:
      <<: *backend-depends
      db-migrate:
        condition: service_completed_successfully
      mod-usuarios:
        condition: service_healthy
      mod-planes-estudio:
        condition: service_healthy
      mod-programas-estudio:
        condition: service_healthy
      mod-gestion-academica:
        condition: service_healthy
      mod-auditoria:
        condition: service_healthy
      mod-evaluacion:
        condition: service_healthy
      mod-admision:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mod-usuarios:
    <<: *module
    ports:
      - "8001:8001"
    environment:
      <<: *backend-env
      PORT: 8001
      SKIP_MIGRATIONS: "true"
    command: ["python", "-m", "uvicorn", "main:app", "--app-dir", "modules/mod-usuarios", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  mod-planes-estudio:
    <<: *module
    ports:
      - "8002:8002"
    environment:
      <<: *backend-env
      PORT: 8002
      SKIP_MIGRATIONS: "true"
    command: ["python", "-m", "uvicorn", "main:app", "--app-dir", "modules/mod-planes-estudio", "--host", "0.0.0.0", "--port", "8002", "--reload"]

  mod-programas-estudio:
    <<: *module
    ports:
      - "8005:8005"
    environment:
      <<: *backend-env
      PORT: 8005
      SKIP_MIGRATIONS: "true"
    command: ["python", "-m", "uvicorn", "main:app", "--app-dir", "modules/mod-programas-estudio", "--host", "0.0.0.0", "--port", "8005", "--reload"]

  mod-gestion-academica:
    <<: *module
    ports:
      - "8006:8006"
    environment:
      <<: *backend-env
      PORT: 8006
      SKIP_MIGRATIONS: "true"
    command: ["python", "-m", "uvicorn", "main:app", "--app-dir", "modules/mod-gestion-academica", "--host", "0.0.0.0", "--port", "8006", "--reload"]

  mod-auditoria:
    <<: *module
    ports:
      - "8007:8007"
    environment:
      <<: *backend-env
      PORT: 8007
      SKIP_MIGRATIONS: "true"
    command: ["python", "-m", "uvicorn", "main:app", "--app-dir", "modules/mod-auditoria", "--host", "0.0.0.0", "--port", "8007", "--reload"]

  mod-evaluacion:
    <<: *module
    ports:
      - "8008:8008"
    environment:
      <<: *backend-env
      PORT: 8008
      SKIP_MIGRATIONS: "true"
    command: ["python", "-m", "uvicorn", "main:app", "--app-dir", "modules/mod-evaluacion", "--host", "0.0.0.0", "--port", "8008", "--reload"]

  mod-admision:
    <<: *module
    ports:
      - "8009:8009"
    environment:
      <<: *backend-env
      PORT: 8009
      SKIP_MIGRATIONS: "true"
    volumes:
      - ./siga_backend:/app
      - ./docs:/app/docs
    command: ["python", "-m", "uvicorn", "main:app", "--app-dir", "modules/mod-admision", "--host", "0.0.0.0", "--port", "8009", "--reload"]

  siga-frontend:
    build:
      context: ./siga_frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./siga_frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      siga-core:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
